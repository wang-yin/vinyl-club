version: "3.8"

services:
  # Express 後端服務
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vinyl_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # 因為資料庫改跑在本機，這裡要改用 host.docker.internal 才能讓容器連到本機的 Postgres
      DATABASE_URL: postgres://vinyl_user:pig55431@host.docker.internal:5432/vinyl_club_db
    volumes:
      - ./server:/app
      - /app/node_modules
